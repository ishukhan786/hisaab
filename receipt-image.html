<!doctype html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none'"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="receipt-export.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ffffff;display:flex;justify-content:center;align-items:flex-start;padding:12mm;box-sizing:border-box}#receipt-paper{position:relative!important;left:auto!important;top:auto!important;width:180mm!important;max-width:100%!important;margin:0 auto!important}.receipt-party strong{min-width:0;overflow-wrap:anywhere}</style></head><body><article id="receipt-paper" class="receipt-sheet receipt-export" dir="rtl">
      <header class="receipt-header">
        <div class="receipt-brand-block">
          <span class="receipt-kicker">حساب · کمپیوٹرائزڈ واؤچر</span>
          <h3 data-receipt="title"></h3>
        </div>
        <strong class="receipt-badge">انٹری رسید</strong>
      </header>
      <div class="receipt-meta-grid">
        <div class="receipt-meta-item"><span>نمبر شمار</span><strong data-receipt="serial" class="receipt-number"></strong></div>
        <div class="receipt-meta-item"><span>تاریخ</span><strong data-receipt="date" class="receipt-number"></strong></div>
        <div class="receipt-meta-item receipt-meta-party"><span>پارٹی</span><strong data-receipt="branch"></strong></div>
      </div>
      <dl class="receipt-details">
        <div><dt>ارسال کنندہ</dt><dd data-receipt="sender"></dd></div>
        <div><dt>موبائیل نمبر</dt><dd data-receipt="mobile" class="receipt-number"></dd></div>
        <div><dt>وصول کنندہ</dt><dd data-receipt="receiver"></dd></div>
        <div><dt>مقام</dt><dd data-receipt="place"></dd></div>
      </dl>
      <div class="receipt-amounts">
        <div class="receipt-amount-box"><span>بقایا</span><strong data-receipt="balance" class="receipt-number"></strong></div>
        <div class="receipt-amount-box"><span>درہم (AED)</span><strong data-receipt="aed" class="receipt-number"></strong></div>
        <div class="receipt-amount-box receipt-amount-main"><span data-receipt="currency"></span><strong data-receipt="pkr" class="receipt-number"></strong><small data-receipt="pkr-words" class="receipt-words-sub"></small></div>
      </div>
      <footer class="receipt-signatures"><span>تیار کنندہ</span><span>دستخط و مہر</span></footer>
    </article></body></html>
