<!doctype html><html lang="ur" dir="rtl"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'none'; connect-src 'none'; object-src 'none'"><link rel="stylesheet" href="style.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}#receipt-paper{position:absolute;width:760px;max-width:none;transform-origin:top left;left:0;top:0}.receipt-party strong{min-width:0;overflow-wrap:anywhere}</style></head><body><article id="receipt-paper" class="receipt-sheet" dir="rtl">
      <header class="receipt-header"><div><span class="receipt-kicker">حساب</span><h3 data-receipt="title"></h3></div><strong class="receipt-badge">انٹری رسید</strong></header>
      <div class="receipt-meta"><div><span>سریل نمبر</span><strong data-receipt="serial" class="receipt-number"></strong></div><div><span>تاریخ</span><strong data-receipt="date" class="receipt-number"></strong></div></div>
      <div class="receipt-party"><span>پارٹی</span><strong data-receipt="branch"></strong></div>
      <dl class="receipt-details"><div><dt>ارسال کنندہ</dt><dd data-receipt="sender"></dd></div><div><dt>موبائیل نمبر</dt><dd data-receipt="mobile" class="receipt-number"></dd></div><div><dt>وصول کنندہ</dt><dd data-receipt="receiver"></dd></div><div><dt>مقام</dt><dd data-receipt="place"></dd></div></dl>
      <div class="receipt-amounts"><div><span>بقایا</span><strong data-receipt="balance" class="receipt-number"></strong></div><div><span>درہم</span><strong data-receipt="aed" class="receipt-number"></strong></div><div class="receipt-amount-main"><span data-receipt="currency"></span><strong data-receipt="pkr" class="receipt-number"></strong></div></div>
      <footer class="receipt-signatures"><span>تیار کنندہ</span><span>دستخط</span></footer>
    </article></body></html>
